---
- name: Install WireGuard
  ansible.builtin.apt:
    name: wireguard
    state: present

- name: Deploy wg0 configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  diff: false
  notify: Restart wireguard

- name: Enable wg-quick@wg0
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started
