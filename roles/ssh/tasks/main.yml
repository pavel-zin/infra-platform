---
- name: Deploy SSH hardening drop-in
  ansible.builtin.template:
    src: 01-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/01-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Authorize CI deploy key
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ deploy_ssh_public_key }}"
    state: present
