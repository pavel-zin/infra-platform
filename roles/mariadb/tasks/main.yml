---
- name: Create stack directory
  ansible.builtin.file:
    path: /opt/stacks/mariadb
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create data directory (ownership managed by the container entrypoint)
  ansible.builtin.file:
    path: /opt/mariadb/data
    state: directory
    mode: "0750"

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/stacks/mariadb/compose.yml
    owner: root
    group: root
    mode: "0600"
  diff: false

- name: Start MariaDB stack
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/mariadb
    state: present
    pull: always
    remove_orphans: true

- name: Wait for the database to report healthy
  community.docker.docker_container_info:
    name: mariadb
  register: mariadb_info
  until: mariadb_info.container.State.Health.Status == 'healthy'
  retries: 30
  delay: 5
