---
- name: Create web directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/stacks/web
    - /opt/web/nginx/conf.d
    - /opt/web/site
    - /opt/web/certbot/www
    - /opt/web/certbot/conf
    - /opt/web/wordpress
    - /opt/web/php
    - /opt/web/gatus
    - /opt/web/gatus-data

- name: Deploy static site
  ansible.builtin.copy:
    src: site/
    dest: /opt/web/site/
    mode: "0644"
    directory_mode: "0755"

- name: Deploy PHP upload limits
  ansible.builtin.copy:
    src: uploads.ini
    dest: /opt/web/php/uploads.ini
    mode: "0644"

- name: Deploy Gatus configuration
  ansible.builtin.template:
    src: gatus.yml.j2
    dest: /opt/web/gatus/config.yaml
    mode: "0644"

- name: Read SANs of current certificate
  ansible.builtin.command: >
    openssl x509 -noout -ext subjectAltName
    -in /opt/web/certbot/conf/live/{{ domain }}/fullchain.pem
  register: web_cert_sans
  changed_when: false
  failed_when: false

- name: Determine TLS state
  ansible.builtin.set_fact:
    web_tls_active: "{{ tls_enabled and web_cert_sans.rc == 0 }}"
    web_cert_missing: "{{ web_cert_domains
      | difference((web_cert_sans.stdout | default(''))
      | regex_findall('DNS:([^,\\s]+)')) }}"

- name: Render nginx vhosts
  ansible.builtin.include_tasks: vhosts.yml

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/stacks/web/compose.yml
    owner: root
    group: root
    mode: "0600"
  diff: false

- name: Start web stack
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/web
    state: present
    pull: always

- name: Issue or expand Let's Encrypt certificate
  ansible.builtin.command: >-
    docker compose -f /opt/stacks/web/compose.yml run --rm certbot certonly
    --webroot -w /var/www/certbot
    --cert-name {{ domain }}
    {% for d in web_cert_domains %}-d {{ d }} {% endfor %}
    --expand --non-interactive --agree-tos -m {{ certbot_email }}
  when: tls_enabled and web_cert_missing | length > 0
  register: web_cert_issued
  changed_when: true
  notify: Reload nginx

- name: Activate TLS after first issuance
  ansible.builtin.set_fact:
    web_tls_active: true
  when: web_cert_issued is changed  # noqa: no-handler — in-play bootstrap sequencing, must precede re-render

- name: Re-render vhosts with TLS enabled
  ansible.builtin.include_tasks: vhosts.yml
  when: web_cert_issued is changed  # noqa: no-handler — same reason

- name: Wait for WordPress core files (first-boot volume population)
  ansible.builtin.wait_for:
    path: /opt/web/wordpress/wp-settings.php
    timeout: 120

- name: Check WordPress install state
  ansible.builtin.command: >-
    docker compose -f /opt/stacks/web/compose.yml run --rm -T
    wpcli wp core is-installed
  register: web_wp_installed
  changed_when: false
  failed_when: web_wp_installed.rc not in [0, 1]

- name: Install WordPress
  ansible.builtin.command:
    cmd: >-
      docker compose -f /opt/stacks/web/compose.yml run --rm -T
      wpcli wp core install
      --url=https://blog.{{ domain }} --title=Blog
      --admin_user={{ wordpress_admin_user }}
      --admin_email={{ certbot_email }}
      --prompt=admin_password --skip-email
    stdin: "{{ wordpress_admin_password }}"
  when: web_wp_installed.rc == 1
  changed_when: true
  no_log: true

- name: Check Redis object-cache drop-in
  ansible.builtin.stat:
    path: /opt/web/wordpress/wp-content/object-cache.php
  register: web_redis_dropin

- name: Install and activate Redis object cache plugin
  ansible.builtin.command: >-
    docker compose -f /opt/stacks/web/compose.yml run --rm -T
    wpcli wp plugin install redis-cache --activate
  when: not web_redis_dropin.stat.exists
  changed_when: true

- name: Enable Redis object cache
  ansible.builtin.command: >-
    docker compose -f /opt/stacks/web/compose.yml run --rm -T
    wpcli wp redis enable
  when: not web_redis_dropin.stat.exists
  changed_when: true

- name: Check for active plugins without auto-updates
  ansible.builtin.command: >-
    docker compose -f /opt/stacks/web/compose.yml run --rm -T
    wpcli wp plugin list --field=name --auto_update=off --status=active
  register: web_plugins_manual
  changed_when: false

- name: Enable plugin auto-updates
  ansible.builtin.command: >-
    docker compose -f /opt/stacks/web/compose.yml run --rm -T
    wpcli wp plugin auto-updates enable --all
  when: web_plugins_manual.stdout_lines | length > 0
  changed_when: true

- name: Deploy certbot renewal service unit
  ansible.builtin.template:
    src: certbot-renew.service.j2
    dest: /etc/systemd/system/certbot-renew.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart certbot renewal timer

- name: Deploy certbot renewal timer unit
  ansible.builtin.template:
    src: certbot-renew.timer.j2
    dest: /etc/systemd/system/certbot-renew.timer
    owner: root
    group: root
    mode: "0644"
  notify: Restart certbot renewal timer

- name: Enable certbot renewal timer
  ansible.builtin.systemd:
    name: certbot-renew.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Deploy wp-cron service unit
  ansible.builtin.template:
    src: wp-cron.service.j2
    dest: /etc/systemd/system/wp-cron.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart wp-cron timer

- name: Deploy wp-cron timer unit
  ansible.builtin.template:
    src: wp-cron.timer.j2
    dest: /etc/systemd/system/wp-cron.timer
    owner: root
    group: root
    mode: "0644"
  notify: Restart wp-cron timer

- name: Enable wp-cron timer
  ansible.builtin.systemd:
    name: wp-cron.timer
    enabled: true
    state: started
    daemon_reload: true
