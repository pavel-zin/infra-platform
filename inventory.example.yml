---
all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_common_args: -o IdentitiesOnly=yes
  children:
    edge:
      hosts:
        edge1:
          ansible_host: <edge-public-ip>
          ansible_ssh_private_key_file: ~/.ssh/<your-key>
    core:
      hosts:
        core1:
          ansible_host: <core-public-ip>
          ansible_ssh_private_key_file: ~/.ssh/<your-key2>
