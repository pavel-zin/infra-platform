---
- name: Base configuration
  hosts: all
  become: true
  roles:
    - bootstrap
    - ssh
    - wireguard

- name: Host firewall
  hosts: core,edge
  become: true
  serial: 1
  roles:
    - nftables

- name: Container runtime
  hosts: all
  become: true
  roles:
    - docker

- name: Database (core only)
  hosts: core
  become: true
  roles:
    - mariadb

- name: Web
  hosts: edge
  become: true
  roles:
    - web

- name: Metrics exporters
  hosts: all
  become: true
  roles:
    - exporters

- name: Monitoring
  hosts: core
  become: true
  roles:
    - monitoring

- name: Backups
  hosts: all
  become: true
  roles:
    - backup
